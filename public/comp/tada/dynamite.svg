      <stop offset="0" stop-color="#8E1206"/><stop offset=".35" stop-color="#FF4A2A"/><stop offset=".6" stop-color="#E0301E"/><stop offset="1" stop-color="#7A0E04"/>
    </linearGradient>
    <radialGradient id="end"><stop offset="0" stop-color="#FFE0A0"/><stop offset=".6" stop-color="#E8A040"/><stop offset="1" stop-color="#8A4A10"/></radialGradient>
    <radialGradient id="spark"><stop offset="0" stop-color="#fff"/><stop offset=".3" stop-color="#FFF2A0"/><stop offset=".6" stop-color="#FFB000" stop-opacity=".8"/><stop offset="1" stop-color="#FF6A00" stop-opacity="0"/></radialGradient>
