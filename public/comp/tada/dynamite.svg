  <circle cx="98" cy="16" r="16" fill="url(#spark)"/>
  <path d="M98 2 L100 13 L112 12 L101 18 L106 30 L97 20 L88 28 L93 17 L82 12 L95 13 Z" fill="#FFF6C8"/>
