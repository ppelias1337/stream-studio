<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stream Studio</title>
<style>
  /* The playing PC's first screen: one field for the stream PC's address. Shown by main.js
     when there is no address yet, and again whenever the stream PC stops answering. */
  :root{color-scheme:dark;
        --bg:#0C0D10;--panel:#1A1B20;--edge:rgba(255,255,255,.11);
        --fg:#EDEDF0;--fg-2:#A3A4AD;--fg-3:#7F808A;--accent:#6A58F0;--accent-fg:#AFA3FF;--warn:#F2B31F;
        --ui:"Segoe UI Variable Text","Segoe UI Variable","Segoe UI",system-ui,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--fg);font:14px var(--ui);-webkit-font-smoothing:antialiased}
  .card{width:min(460px,100%);display:flex;flex-direction:column;gap:14px;text-align:center}
  h1{font-size:22px;font-weight:650}
  p{color:var(--fg-2);line-height:1.5}
  p.hint{font-size:13px;color:var(--fg-3)}
  #why:empty{display:none}
  #why{padding:9px 12px;border-radius:8px;font-size:13px;color:var(--warn);background:rgba(242,179,31,.1);box-shadow:inset 0 0 0 1px rgba(242,179,31,.35)}
  .row{display:flex;gap:8px}
  input{flex:1;min-width:0;height:40px;padding:0 12px;font:inherit;color:var(--fg);background:var(--panel);border:none;border-radius:8px;box-shadow:inset 0 0 0 1px var(--edge)}
  input:focus{outline:2px solid var(--accent-fg);outline-offset:1px}
  button{height:40px;padding:0 18px;font:inherit;font-weight:600;color:#fff;background:var(--accent);border:none;border-radius:8px;cursor:pointer}
  button:hover{filter:brightness(1.1)}
</style>
</head>
<body>
<div class="card">
  <h1>Connect to the stream PC</h1>
  <p id="why"></p>
  <p>On the stream PC, click <b>OBS links</b> in Stream Studio. Type the address it shows under <b>This PC on the network</b>.</p>
  <div class="row">
    <input id="host" placeholder="192.168.1.254" spellcheck="false" aria-label="Stream PC address">
    <button id="go" type="button">Connect</button>
  </div>
  <p class="hint">Asked once. This window opens straight onto the show from now on.</p>
</div>
<script>
  const why = new URLSearchParams(location.search).get("why");
  if(why) document.getElementById("why").textContent = "Couldn't reach the stream PC: " + why + ". Check it is on and Stream Studio is open.";
  const host = document.getElementById("host");
  // paste the whole address if that is what they have: http://192.168.1.254:8787/app -> 192.168.1.254
  const go = () => { const v = host.value.trim().replace(/^\w+:\/\//,"").replace(/[:/].*$/,""); if(v) window.studio.connectTo(v); };
  document.getElementById("go").onclick = go;
  host.onkeydown = e => { if(e.key === "Enter") go(); };
  host.focus();
</script>
</body>
</html>
